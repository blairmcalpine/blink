[package]
name = "blink-app"
description = "The blink binary: hotkey, configuration, and pipeline wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "blink"
path = "src/main.rs"

[dependencies]
blink-audio = { path = "../blink-audio" }
blink-config = { path = "../blink-config" }
blink-encode = { path = "../blink-encode" }
blink-ring = { path = "../blink-ring" }
blink-sys = { path = "../blink-sys" }
blink-ui = { path = "../blink-ui" }
# The `Code` and `Modifiers` types `global-hotkey` re-exports; depending on
# them directly keeps the key mapping portable and unit tested on every host.
keyboard-types = { version = "0.8", default-features = false }
parking_lot = "0.13"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Encodes the images in assets/blink.ico for the test that keeps it current.
png = "0.18"
tempfile.workspace = true

# Only does anything when the target is Windows, but build dependencies are
# selected by the host, so this cannot sit under a cfg(windows) table.
[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
blink-capture = { path = "../blink-capture" }
blink-mux = { path = "../blink-mux" }
global-hotkey = "0.10"
rfd.workspace = true
time = { version = "0.3", default-features = false, features = ["local-offset", "std"] }
tracing-appender = "0.2"
tray-icon = { version = "0.26", default-features = false }

[lints]
workspace = true
