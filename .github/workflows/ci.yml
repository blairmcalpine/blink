name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Decides which jobs a pull request needs. Pushes to main and manual runs
  # take every job, which also keeps main's caches warm for pull requests.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      miri: ${{ github.event_name != 'pull_request' || steps.filter.outputs.miri == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}
      notices: ${{ github.event_name != 'pull_request' || steps.filter.outputs.notices == 'true' }}
    steps:
      - name: Filter changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - ".cargo/**"
              - ".github/workflows/ci.yml"
              - "Cargo.lock"
              - "Cargo.toml"
              - "clippy.toml"
              - "crates/**"
              - "rust-toolchain.toml"
            miri:
              - ".github/workflows/ci.yml"
              - "Cargo.lock"
              - "Cargo.toml"
              - "crates/blink-ring/**"
            deps:
              - ".github/workflows/ci.yml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"
            notices:
              - ".github/workflows/ci.yml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "THIRD-PARTY-NOTICES.txt"
              - "about.hbs"
              - "about.toml"
              - "justfile"
              - "rust-toolchain.toml"

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install taplo
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: taplo

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: taplo fmt
        run: taplo fmt --check

      - name: typos
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install cargo-nextest
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo nextest
        run: cargo nextest run --workspace --all-features --locked --no-tests=pass

      - name: cargo test --doc
        run: cargo test --doc --workspace --locked

  doc:
    name: doc
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: doc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features --locked

  miri:
    name: miri
    needs: changes
    if: needs.changes.outputs.miri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly with miri
        run: rustup toolchain install nightly --component miri,rust-src

      - name: Install cargo-nextest
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest

      # Interpreting the tests dominates; nextest runs them in parallel.
      - name: cargo miri nextest
        run: cargo +nightly miri nextest run -p blink-ring

      - name: cargo miri test --doc
        run: cargo +nightly miri test --doc -p blink-ring

  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          msrv="$(grep -m1 -oE '^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"[^"]+"' Cargo.toml \
            | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' || true)"
          if [ -z "${msrv}" ]; then
            echo "::error file=Cargo.toml::could not read rust-version from [workspace.package]"
            exit 1
          fi
          echo "MSRV ${msrv}"
          echo "msrv=${msrv}" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        shell: bash
        run: rustup toolchain install "${{ steps.msrv.outputs.msrv }}" --profile minimal --target x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.msrv }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check on MSRV
        shell: bash
        run: cargo +${{ steps.msrv.outputs.msrv }} check --workspace --all-targets --locked

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features

  machete:
    name: machete
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-machete

      - name: cargo machete
        run: cargo machete

  notices:
    name: notices
    needs: changes
    if: needs.changes.outputs.notices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install cargo-about and just
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-about@0.9.3,just

      - name: THIRD-PARTY-NOTICES.txt is current
        run: just notices-check

  ci-success:
    name: ci-success
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - format
      - clippy
      - test
      - doc
      - miri
      - msrv
      - deny
      - machete
      - notices
    # A job skipped by the `changes` filter counts as passing.
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs did not succeed."
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: All required jobs succeeded
        run: echo "All required jobs succeeded."
