name: Release

on:
  push:
    branches: [main]

permissions: {}

# Runs queue rather than cancel, so a release is never left half made.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Tags v{version} and opens a draft GitHub release when the workspace version
  # has no tag yet, that is, when a release PR (or the first release) merges.
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: release-plz release
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: "0.4.3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the blink tag
        id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag="$(jq -r '.[] | select(.package_name == "blink-app") | .tag' <<< "${RELEASES:-[]}")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # Opens or updates the release PR. Waits for `release` so it sees a new tag.
  release-pr:
    name: release-pr
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      # Pull requests opened with GITHUB_TOKEN do not trigger CI.
      - name: release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: "0.4.3"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  package:
    name: package
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/package-windows.yml
    with:
      ref: ${{ needs.release.outputs.tag }}

  publish:
    name: publish
    needs: [release, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Download the MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blink-msi
          path: dist

      - name: Attach the MSI to the release
        run: gh release upload "$TAG" dist/* --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
