name: PR title

# Squash merges use the PR title as the commit message, and release-plz reads
# those messages as Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: conventional-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
