# Local git hooks. Enable once per clone with `lefthook install`.

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    taplo:
      glob: "*.toml"
      run: taplo fmt --check
    typos:
      run: typos

pre-push:
  commands:
    lint-test:
      run: just lint test
